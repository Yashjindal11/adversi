[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adversi"
dynamic = ["version"]
description = "An open-source framework for building adversarial, evidence-aware multi-agent AI systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yash Jindal" }]
requires-python = ">=3.11"
keywords = ["llm", "multi-agent", "debate", "reasoning", "evaluation", "fact-checking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# The core stays deliberately small: data models + one HTTP client.
dependencies = [
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "pyyaml>=6",
  "types-PyYAML",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pre-commit>=3",
]

[project.scripts]
adversi = "adversi.cli.main:main"

[project.urls]
Documentation = "https://github.com/Yashjindal11/adversi/tree/main/docs"
Source = "https://github.com/Yashjindal11/adversi"
Issues = "https://github.com/Yashjindal11/adversi/issues"

[tool.hatch.version]
path = "src/adversi/_version.py"

[tool.hatch.build]
# The web UI build output is git-ignored but must ship in wheels.
artifacts = ["src/adversi/server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/adversi"]

[tool.hatch.build.targets.sdist]
include = ["src/adversi", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "live: calls a real model provider; skipped unless ADVERSI_LIVE_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "E501", # line length is owned by `ruff format`; long string literals are allowed
  "S101", # asserts are fine in tests and for type narrowing
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"examples/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["adversi"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*", "yaml.*"]
ignore_missing_imports = true
